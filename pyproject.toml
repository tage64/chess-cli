[project]
name = "chess-cli"
requires-python = ">=3.12, <3.15"
version = "0.6.1"
description = "A repl to edit and analyse chess games."
authors = [{name = "Tage Johansson", email = "tajo9185@student.uu.se"}]
license = "GPL-3.0-or-later"
dependencies = [
    "chess>=1.11.1,<2",
    "appdirs>=1.4.4,<2",
    "toml>=0.10.2,<0.11",
    "more-itertools>=10.5.0,<11",
    "psutil>=6.1.0,<7",
    "berserk>=0.13.2,<0.14",
    "authlib>=1.3.2,<2",
    "requests>=2.32.3,<3",
    "prompt-toolkit>=3.0.48,<4",
    "pyaudio>=0.2.14,<0.3",
    "cairosvg>=2.7.1,<3",
    "pydantic>=2.9.2,<3",
    "spdx-license-list>=3.25.0,<4",
    "markdown-it-py>=4.0,<5",
    "inflect>=7.4.0,<8",
    "typeguard @ git+https://github.com/tage64/typeguard",
    "pyperclip>=1.9.0,<2",
    "progressbar2>=4.5.0,<5",
    "click>=8.1.7,<9",
]

[project.scripts]
chess-cli = "chess_cli.main:main"

[dependency-groups]
dev = [
    "types-requests>=2.32.0.20241016,<3",
    "pyright>=1.1.385,<2",
    "ruff>=0.6.1,<0.7",
    "nuitka>=2.4.10,<3",
    "pre-commit>=3.8.0,<4",
]

[project.urls]
homepage = "https://github.com/tage64/chess-cli"
documentation = "https://github.com/tage64/chess-cli/blob/main/doc/manual.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 100
fast = true
preview = true
src = "chess_cli/"

[tool.docformatter]
in-place = true
recursive = true
black = true
wrap-summeries = 100
wrap-descriptions = 100

[tool.isort]
src_paths = ["chess_cli/"]
profile = "black"
line_length = 100
py_version = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
preview = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff
    "I",  # isort
    "D",  # pydocstyle
]
ignore = ["D1", "D2", "D401"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.mypy]
files = "chess_cli/*.py"
check_untyped_defs = true
warn_unreachable = true

[tool.pyright]
include = ["chess_cli/"]
reportWildcardImportFromLibrary = false
reportIncompatibleMethodOverride = false  # Bug in pyright: Incorrectly classifies setting a setter as an error.
